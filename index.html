<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cuisine Miroir</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poiret+One&family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500&family=Josefin+Sans:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--gold:#d4af37;--gold2:#f1d78a;--navy:#0e1424;--cream:#f4ead6;--sol:#e0603a;--lune:#2a9d8f}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;color:var(--cream);font-family:'Cormorant Garamond',Georgia,serif}
body{background:#0b1020 radial-gradient(ellipse at top,#1c2748 0%,#0b1020 65%) fixed}
#app{max-width:1120px;margin:0 auto;padding:14px 12px 28px;display:flex;flex-direction:column;align-items:center;gap:14px}
#stage{position:relative;width:min(100%,max(640px,calc((100vh - 190px) * 1.749)))}
canvas#game{display:block;width:100%;height:auto;border:1px solid rgba(212,175,55,.55);border-radius:4px;outline:3px double rgba(212,175,55,.35);outline-offset:5px;background:#0e1424}
.screen{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(8,11,24,.74);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);border-radius:4px;overflow:auto;padding:14px}
.screen.hidden{display:none}
.card{background:linear-gradient(#141c33,#0d1325);border:1px solid var(--gold);outline:1px solid rgba(212,175,55,.35);outline-offset:-8px;padding:24px 34px;max-width:820px;width:100%;text-align:center;position:relative;max-height:100%;overflow:auto}
.card:before,.card:after{content:'';position:absolute;width:38px;height:38px;border:1px solid var(--gold);pointer-events:none}
.card:before{top:14px;left:14px;border-right:none;border-bottom:none;border-radius:38px 0 0 0}
.card:after{bottom:14px;right:14px;border-left:none;border-top:none;border-radius:0 0 38px 0}
h1{font-family:'Poiret One',cursive;font-weight:400;color:var(--gold2);letter-spacing:.14em;font-size:clamp(34px,6vw,62px);margin:.05em 0}
h2{font-family:'Poiret One',cursive;font-weight:400;color:var(--gold2);letter-spacing:.12em;font-size:30px;margin:.1em 0 .3em}
h3{font-family:'Josefin Sans',sans-serif;font-weight:600;text-transform:uppercase;letter-spacing:.2em;font-size:13px;color:var(--gold);margin:14px 0 8px}
p{font-size:19px;line-height:1.4;margin:.4em 0}
.sub{font-style:italic;font-size:22px;color:#d9cdb3;margin:0 0 14px}
.small{font-size:15px;color:#b9ae96}
.deco{color:var(--gold);letter-spacing:.6em;font-size:13px}
.btn{font-family:'Josefin Sans',sans-serif;text-transform:uppercase;letter-spacing:.18em;font-size:13px;color:var(--gold2);background:transparent;border:1px solid var(--gold);padding:11px 20px;margin:6px;cursor:pointer;transition:background .2s,color .2s}
.btn:hover{background:var(--gold);color:#121a2e}
.btn.primary{background:var(--gold);color:#121a2e}
.btn.primary:hover{background:var(--gold2)}
.btn[disabled]{opacity:.35;cursor:default}
.kbd,kbd{display:inline-block;min-width:24px;padding:2px 6px;margin:0 2px;border:1px solid rgba(212,175,55,.7);border-bottom-width:2px;border-radius:4px;font-family:'Josefin Sans',sans-serif;font-size:12px;color:var(--gold2);background:#121a2e;text-align:center}
.chars{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-top:8px}
.team{border:1px solid rgba(212,175,55,.4);padding:12px}
.team h3{margin-top:2px}
.team.sol h3{color:#f08a63}.team.lune h3{color:#5cc8b8}
.roster{display:flex;flex-wrap:wrap;justify-content:center;gap:6px}
.chr{width:84px;padding:4px 2px 6px;border:1px solid rgba(212,175,55,.25);background:#0f1629;cursor:pointer;color:var(--cream)}
.chr canvas{display:block;margin:0 auto}
.chr span{font-family:'Josefin Sans',sans-serif;font-size:11px;letter-spacing:.12em;text-transform:uppercase}
.chr.sel{border-color:var(--gold2);background:#1d2745;box-shadow:0 0 0 1px var(--gold2) inset}
.desc{min-height:22px;font-style:italic;font-size:16px;color:#d9cdb3;margin-top:6px}
.course{display:grid;grid-template-columns:130px 1fr;gap:12px;align-items:center;border-top:1px solid rgba(212,175,55,.25);padding:10px 0;text-align:left}
.course .cname{font-family:'Poiret One',cursive;font-size:22px;color:var(--gold2);letter-spacing:.08em}
.course .lv{display:flex;flex-wrap:wrap;gap:8px}
.lvbtn{font-family:'Cormorant Garamond',serif;font-size:17px;text-transform:none;letter-spacing:.02em;padding:8px 14px;margin:0;text-align:left;line-height:1.15}
.lvbtn .st{display:block;font-size:14px;color:var(--gold);letter-spacing:.2em}
.lvbtn:hover .st{color:#121a2e}
.soon{font-style:italic;color:#8d8471;font-size:16px}
.roles{display:grid;grid-template-columns:1fr 1fr;gap:14px;text-align:left;margin:12px 0}
.roles div{border-left:2px solid;padding:4px 12px;font-size:17px;line-height:1.35}
.roles .r1{border-color:var(--sol)}.roles .r2{border-color:var(--lune)}
.stars{font-size:46px;letter-spacing:.15em;color:var(--gold2)}
.off{color:#3a4463!important}
.stats{display:flex;justify-content:center;gap:26px;flex-wrap:wrap;margin:8px 0 14px}
.stats div{font-family:'Josefin Sans',sans-serif;font-size:12px;letter-spacing:.15em;text-transform:uppercase;color:#b9ae96}
.stats b{display:block;font-family:'Poiret One',cursive;font-size:30px;color:var(--gold2);letter-spacing:.05em;font-weight:400}
#bar{width:min(100%,640px)}
#carnetPanel{display:none}
.status{font-size:15px;color:#b9ae96;align-self:center;margin-right:8px}
.keys{display:flex;justify-content:center;gap:40px;margin:14px 0 6px;align-items:center}
.keys>div{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:16px;color:#d9cdb3}
.keys kbd{font-size:16px;min-width:34px;padding:5px 8px;margin:2px}
.keys .space{min-width:150px}
.pad{text-align:center;line-height:1}
.small-btn{font-size:11px;padding:7px 12px}
.panel{border:1px solid rgba(212,175,55,.45);background:rgba(14,20,36,.85);padding:10px 14px;font-size:16px;line-height:1.7}
.panel .pt{font-family:'Josefin Sans',sans-serif;font-size:12px;letter-spacing:.22em;text-transform:uppercase;margin-bottom:4px}
.panel.sol .pt{color:#f08a63}.panel.lune .pt{color:#5cc8b8}.panel.mid .pt{color:var(--gold)}
#carnetList{list-style:none;margin:0;padding:0;font-size:16px;line-height:1.35}
#carnetList li{padding:3px 0 3px 18px;position:relative}
#carnetList li:before{content:'✦';position:absolute;left:0;color:var(--gold);font-size:12px;top:5px}
#carnetList li.mys{color:#7f7867;font-style:italic}
#carnetList li.mys:before{content:'?';color:#7f7867}
kbd.wide{min-width:70px}
.howto{font-size:16px;line-height:1.35;color:#d9cdb3;margin-bottom:6px}
#carnetList:not(:empty){border-top:1px solid rgba(212,175,55,.25);padding-top:6px}
.newb{display:inline-block;font-family:'Josefin Sans',sans-serif;font-size:11px;letter-spacing:.2em;background:var(--gold);color:#121a2e;padding:3px 10px;margin-bottom:6px}
.big{font-size:23px;line-height:1.35;margin:.3em 0 .5em}
.opts{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin-top:10px}
.lobby{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-top:14px;text-align:center}
.lobby>div{border:1px solid rgba(212,175,55,.4);padding:12px 14px}
#joinCode{font-family:'Poiret One',cursive;font-size:30px;letter-spacing:.35em;text-align:center;width:170px;background:#0b1020;color:var(--gold2);border:1px solid var(--gold);padding:6px 0 6px .35em;text-transform:uppercase;display:block;margin:6px auto}
.bigcode{font-family:'Poiret One',cursive;font-size:72px;letter-spacing:.3em;color:var(--gold2);margin:4px 0 6px;padding-left:.3em}
.err{color:#ff9d8a;font-size:17px}
.link{font-family:'Josefin Sans',sans-serif;font-size:13px;color:var(--gold2);word-break:break-all;user-select:all}
.readies{display:flex;justify-content:center;gap:26px;margin:6px 0 4px;font-size:17px}
.ok{color:#8fe3a0}
.code{font-family:'Poiret One',cursive;font-size:22px;letter-spacing:.2em;color:var(--gold2)}
.panel.room .small{font-size:14px;color:#b9ae96}
#tools{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
#tools .btn{padding:7px 14px;font-size:11px;margin:0}
@media (max-width:820px){#bar{grid-template-columns:1fr}.chars,.roles{grid-template-columns:1fr}}
</style>
</head>
<body>
<div id="app">
  <div id="stage">
    <canvas id="game" width="1060" height="606"></canvas>
    <div id="overlay" class="screen"></div>
  </div>
  <div id="bar">
    <div class="panel mid" id="carnetPanel">
      <div class="pt">Carnet des liens</div>
      <ul id="carnetList"></ul><div class="howto" id="carnetEmpty"></div>
    </div>
  </div>
  <div id="tools">
    <span id="barRoom" class="status"></span>
    <button class="btn" id="pauseBtn">Pause</button>
    <button class="btn" id="muteBtn">Son : activé</button>
    <button class="btn" id="menuBtn">Menu</button>
  </div>
</div>
<script>
(()=>{
'use strict';
// ---------- Dimensions ----------
const T=54,KW=9,KH=7,MIRW=60,HUD=118,FOOT=62,PAD=14,WALL=46;
const KPX=KW*T, CW=PAD*2+KPX*2+MIRW, CH=HUD+WALL+2+KH*T+FOOT;
const OX=[PAD,PAD+KPX+MIRW], OY=HUD+WALL+2, TOPH=T*0.74, MX=PAD+KPX;
const COOK=7, RUIN=10, CHOPT=2.2, SPEED=4.3, DARKT=5;
const cv=document.getElementById('game');
let c=cv.getContext('2d'), DPR=1;
function resize(){DPR=Math.min(2,window.devicePixelRatio||1);cv.width=CW*DPR;cv.height=CH*DPR;}
resize();addEventListener('resize',resize);

// ---------- Données ----------
const THEME=[
 {name:'Soleil',floorA:'#f8e9cd',floorB:'#e4bd8f',top:'#cf8f57',front:'#5e331b',trim:'#e6bb62',grain:'rgba(255,225,180,.3)',accent:'#e0603a',knob:'#d8452b',wall:'#7a2e1c',wallLine:'rgba(241,200,120,.35)',lamp:'rgba(255,210,140,1)',light:'rgba(255,238,195,.38)',jar1:'#e0a040',jar2:'#c0563a'},
 {name:'Lune',floorA:'#ecf4f2',floorB:'#b8d7d3',top:'#8aacbf',front:'#2a4253',trim:'#e4ecf1',grain:'rgba(255,255,255,.35)',accent:'#2a9d8f',knob:'#2f7fd1',wall:'#123f47',wallLine:'rgba(200,235,240,.3)',lamp:'rgba(170,220,255,1)',light:'rgba(225,246,255,.38)',jar1:'#7bc5b8',jar2:'#5b8fd1'}
];
const CHARTYPE={'.':'floor','1':'floor','#':'counter','C':'board','R':'mboard','F':'stove','G':'freezer','P':'plates','S':'serve','X':'trash','L':'lever','M':'lever','N':'lever','W':'sink','t':'crate','l':'crate','c':'crate','f':'crate'};
const CRATE={t:'tomate',l:'laitue',c:'citron',f:'fraise'};
const CHOP=new Set(['tomate','laitue','citron','fraise']);
const PLATEABLE=new Set(['tomate_coupe','laitue_coupe','citron_coupe','fraise_coupe','soupe','sorbet']);
const MACH={
 stove:{input:'tomate_coupe',out:'soupe',ruin:'brule',name:'fourneau',ruinMsg:'Brûlé !',wrong:'Le fourneau attend une tomate coupée'},
 freezer:{input:'citron_coupe',out:'sorbet',ruin:'glacon',name:'sorbetière',ruinMsg:'Trop gelé !',wrong:'La sorbetière attend un citron coupé'}
};
const RECIPES={
 tranches:{nom:'Tomates tranchées',items:['tomate_coupe']},
 fraises:{nom:'Fraises fraîches',items:['fraise_coupe']},
 salade:{nom:'Salade du palais',items:['tomate_coupe','laitue_coupe']},
 soupe:{nom:'Velouté de tomate',items:['soupe']},
 fruits:{nom:'Fraises au citron',items:['fraise_coupe','citron_coupe']},
 sorbet:{nom:'Sorbet citron',items:['sorbet']}
};
const SKINS=[
 {id:'brioche',nom:'Brioche',desc:'Petit pain doré, toujours de bonne humeur.',body:'#eab463',shade:'#c98a3e'},
 {id:'piment',nom:'Piment',desc:'Rapide comme l’éclair, un peu trop épicé.',body:'#dc4430',shade:'#a92c1d'},
 {id:'mochi',nom:'Mochi',desc:'Doux comme un nuage de riz au clair de lune.',body:'#f6f2fb',shade:'#d3cce4'},
 {id:'radis',nom:'Radis',desc:'Croquant, rose et très organisé.',body:'#e35b86',shade:'#b8395f'},
 {id:'champi',nom:'Champi',desc:'Discret sous son chapeau, jamais en retard.',body:'#f0e2cb',shade:'#cdb894'}
];
const MAP_A1=["#t#######","#.......#","S.......C","#..##...#","P.......#","#...1...#","##X######"];
const MAP_A2=["#t###F###","#.......L","S.......C","#..##...#","P.......#","#...1...#","##X######"];
const MAP_E1=["#t###F###","#.......L","S.......C","#..##...M","P.......#","#...1...#","##X######"];
const MAP_E2=["#t#l#F###","#.......#","S.......C","#..##...W","P.......#","#...1...#","##X######"];
const MAP_E3=["#t#l#F#L#","#.......M","S.......C","#..##...N","P.......#","#...1...W","##X######"];
const KH_=(K,ch)=>tileByChar(K,ch);
const plated=(p,k)=>p.held&&p.held.k==='assiette'&&(k?p.held.c.includes(k):p.held.c.length>0);
const LEVELS=[
 {id:'a1',course:'Apéritif',num:'I',name:'Le premier reflet',map:MAP_A1,subs:{t:'f',C:'R'},hidden:false,mode:'goal',goal:3,timeStars:[180,300],
  recipes:[['tranches'],['fraises']],first:[['tranches'],['fraises']],
  nouveau:'Ta planche coupe aussi… de l’autre côté.',
  intro:'La planche de Lune n’a pas de couteau. Quand Soleil coupe sur sa planche, la planche reflet de Lune est coupée en même temps.',
  but:'Servez 3 assiettes chacun. Pas de chrono : prenez votre temps, les flèches dorées vous guident.',
  tuto:[[
   ['Prends une tomate dans la caisse',K=>kitchenHas(K,'tomate_cru')||kitchenHas(K,'tomate_coupe')],
   ['Pose-la sur ta planche',K=>{const b=KH_(K,'C');return (b.item&&b.item.k==='tomate')||kitchenHas(K,'tomate_coupe');}],
   ['Reste appuyé pour couper',K=>kitchenHas(K,'tomate_coupe')],
   ['Pose-la sur les assiettes',(K,p)=>plated(p)||K.served>0],
   ['Sers à la passe dorée',K=>K.served>0],
   ['Lune a besoin de toi : coupe sur ta planche !',K=>G.kitchens[1].served>0]
  ],[
   ['Prends une fraise dans la caisse',K=>kitchenHas(K,'fraise_cru')||kitchenHas(K,'fraise_coupe')],
   ['Pose-la sur ta planche',K=>{const b=KH_(K,'R');return (b.item&&b.item.k==='fraise')||kitchenHas(K,'fraise_coupe');}],
   ['Pas de couteau… demande à Soleil de couper !',K=>kitchenHas(K,'fraise_coupe')],
   ['Pose-la sur les assiettes',(K,p)=>plated(p)||K.served>0],
   ['Sers à la passe dorée',K=>K.served>0]
  ]],
  links:[{f:[0,'C','chop'],t:[1,'R','chop'],label:'Couper sur la planche Soleil coupe aussi la planche reflet Lune'}]},
 {id:'a2',course:'Apéritif',num:'II',name:'Chaud et froid',map:MAP_A2,subs:{t:'c',F:'G',C:'R'},patch:[[1,0,'f']],hidden:false,mode:'goal',goal:3,timeStars:[240,390],
  recipes:[['tranches','soupe'],['fraises','sorbet']],first:[['soupe'],['sorbet']],
  nouveau:'Ton feu s’allume depuis l’autre cuisine.',
  intro:'Le levier de Lune allume et éteint le fourneau de Soleil. Le levier de Soleil allume et éteint la sorbetière de Lune. Un plat prêt qu’on oublie finit brûlé ou gelé !',
  but:'Servez 3 assiettes chacun. Toujours pas de chrono.',
  tuto:[[
   ['Coupe une tomate, mets-la dans la marmite',K=>!!KH_(K,'F').item||K.served>0],
   ['Demande à Lune d’allumer ton feu !',K=>KH_(K,'F').on||K.served>0],
   ['Prends une assiette, puis la soupe',(K,p)=>plated(p,'soupe')||K.served>0],
   ['Sers… et fais éteindre ton feu !',K=>K.served>0]
  ],[
   ['Fais couper un citron par Soleil',K=>kitchenHas(K,'citron_coupe')||!!KH_(K,'G').item||K.served>0],
   ['Mets-le dans la sorbetière',K=>!!KH_(K,'G').item||K.served>0],
   ['Demande à Soleil d’allumer ta sorbetière !',K=>KH_(K,'G').on||K.served>0],
   ['Prends une assiette, puis le sorbet, et sers',K=>K.served>0]
  ]],
  links:[{f:[0,'C','chop'],t:[1,'R','chop'],label:'Couper sur la planche Soleil coupe aussi la planche reflet Lune'},
         {f:[0,'L','use'],t:[1,'G','power'],label:'Levier Soleil : allume ou éteint la sorbetière Lune'},
         {f:[1,'L','use'],t:[0,'F','power'],label:'Levier Lune : allume ou éteint le fourneau Soleil'}]},
 {id:'e1',course:'Entrée',num:'I',name:'Reflets cachés',map:MAP_E1,subs:{t:'c',F:'G',C:'R'},patch:[[1,0,'f']],hidden:true,mode:'goal',goal:4,timeStars:[300,480],
  recipes:[['tranches','soupe'],['fraises','sorbet']],first:[['soupe'],['sorbet']],
  nouveau:'Les liens sont cachés.',
  intro:'Chaque cuisine a maintenant deux leviers. Lequel allume le feu de l’autre ? Testez, observez, et dites à voix haute ce que vous faites. Attention : un levier est un piège.',
  but:'Servez 4 assiettes chacun. Pas de chrono.',
  links:[{f:[0,'C','chop'],t:[1,'R','chop'],label:'Couper sur la planche Soleil coupe aussi la planche reflet Lune'},
         {f:[0,'M','use'],t:[1,'G','power'],label:'Levier bas de Soleil : allume ou éteint la sorbetière Lune'},
         {f:[0,'L','use'],t:[1,null,'dark'],label:'Levier haut de Soleil : plonge la Cuisine Lune dans le noir (piège)'},
         {f:[1,'L','use'],t:[0,'F','power'],label:'Levier haut de Lune : allume ou éteint le fourneau Soleil'},
         {f:[1,'M','use'],t:[0,null,'spawn','tomate'],label:'Levier bas de Lune : fait apparaître une tomate chez Soleil'}]},
 {id:'e2',course:'Entrée',num:'II',name:'Gestes du quotidien',map:MAP_E2,subs:{t:'c',l:'f',F:'G'},hidden:true,mode:'timed',dur:200,interval:18,limit:70,maxOrders:2,stars:[80,160,240],
  recipes:[['salade','soupe'],['fruits','sorbet']],first:[['salade'],['fruits']],
  nouveau:'Chrono. Deux ingrédients par plat.',
  intro:'Les plats ont maintenant deux ingrédients. Plus de leviers : les liens se cachent dans le robinet, la poubelle, la planche… Si vous coupez en même temps, tout va deux fois plus vite.',
  but:'Faites un maximum de points avant la fin du chrono.',
  links:[{f:[0,'C','chop'],t:[1,'C','chop'],label:'Couper chez Soleil coupe aussi chez Lune'},
         {f:[1,'C','chop'],t:[0,'C','chop'],label:'Couper chez Lune coupe aussi chez Soleil'},
         {f:[0,'W','use'],t:[1,'G','power'],label:'Robinet Soleil : allume ou éteint la sorbetière Lune'},
         {f:[1,'W','use'],t:[0,'F','power'],label:'Robinet Lune : allume ou éteint le fourneau Soleil'},
         {f:[0,'X','trash'],t:[1,null,'dark'],label:'Jeter chez Soleil éteint la lumière chez Lune (piège)'},
         {f:[1,'X','trash'],t:[0,null,'dark'],label:'Jeter chez Lune éteint la lumière chez Soleil (piège)'}]},
 {id:'e3',course:'Entrée',num:'III',name:'Coup de feu',map:MAP_E3,subs:{t:'c',l:'f',F:'G'},hidden:true,mode:'timed',dur:210,interval:14,limit:62,maxOrders:3,stars:[110,220,320],
  recipes:[['salade','soupe'],['fruits','sorbet']],first:[['soupe'],['sorbet']],
  nouveau:'Coup de feu.',
  intro:'Trois leviers et un robinet de chaque côté, huit liens cachés et des leurres qui ne font rien. Le carnet des liens se remplit tout seul : servez-vous-en !',
  but:'Faites un maximum de points avant la fin du chrono.',
  links:[{f:[0,'C','chop'],t:[1,'C','chop'],label:'Couper chez Soleil coupe aussi chez Lune'},
         {f:[1,'C','chop'],t:[0,'C','chop'],label:'Couper chez Lune coupe aussi chez Soleil'},
         {f:[0,'N','use'],t:[1,'G','power'],label:'Levier du milieu Soleil : sorbetière Lune'},
         {f:[1,'L','use'],t:[0,'F','power'],label:'Levier du haut Lune : fourneau Soleil'},
         {f:[0,'M','use'],t:[1,null,'dark'],label:'Levier mural Soleil : noir chez Lune (piège)'},
         {f:[1,'W','use'],t:[0,null,'dark'],label:'Robinet Lune : noir chez Soleil (piège)'},
         {f:[0,'W','use'],t:[1,null,'spawn','fraise'],label:'Robinet Soleil : une fraise apparaît chez Lune'},
         {f:[1,'M','use'],t:[0,null,'spawn','laitue'],label:'Levier mural Lune : une laitue apparaît chez Soleil'}]}
];
const COURSES=['Apéritif','Entrée','Plat','Fromage','Dessert','Digestif'];

// ---------- Sauvegarde ----------
function load(k,d){try{const v=localStorage.getItem('cuisineMiroir.'+k);return v?JSON.parse(v):d;}catch(e){return d;}}
function save(k,v){try{localStorage.setItem('cuisineMiroir.'+k,JSON.stringify(v));}catch(e){}}
let BEST=load('best',{});

let AC=null,muted=false;

function tone(f,d,type,v,delay,slide){if(!AC||muted)return;try{const t0=AC.currentTime+(delay||0);const o=AC.createOscillator(),g=AC.createGain();o.type=type||'sine';o.frequency.setValueAtTime(f,t0);if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(30,f*slide),t0+d);g.gain.setValueAtTime(0.0001,t0);g.gain.exponentialRampToValueAtTime(v||.1,t0+.012);g.gain.exponentialRampToValueAtTime(0.0001,t0+d);o.connect(g).connect(AC.destination);o.start(t0);o.stop(t0+d+.05);}catch(e){}}
const SFX={
 pick:()=>tone(660,.07,'triangle',.1),drop:()=>tone(440,.08,'triangle',.1),
 chop:()=>{tone(260,.05,'square',.04,0,.4);},lever:()=>{tone(300,.05,'square',.06);tone(520,.05,'square',.05,.05);},
 water:()=>{tone(900,.25,'sine',.05,0,.4);tone(700,.3,'sine',.04,.05,.5);},
 chime:()=>[1047,1319,1568,2093].forEach((f,i)=>tone(f,.7,'sine',.1,i*.08)),
 serve:()=>{tone(1320,.6,'sine',.12);tone(1760,.7,'sine',.07,.05);},
 fail:()=>tone(170,.35,'sawtooth',.06,0,.6),ready:()=>{tone(880,.15,'sine',.09);tone(1175,.25,'sine',.09,.1);},
 warn:()=>tone(1000,.07,'square',.04),order:()=>{tone(784,.1,'triangle',.07);tone(988,.14,'triangle',.07,.08);},
 dark:()=>tone(240,.8,'sine',.1,0,.35),spawn:()=>{tone(660,.1,'sine',.08);tone(990,.18,'sine',.08,.08);},

const GAMEKEYS=new Set([...Object.values(MOVE).flat(),...ACT,'Escape','KeyP']);
const keys={},pressed={};
function typing(){const a=document.activeElement;return !!a&&(a.tagName==='INPUT'||a.tagName==='TEXTAREA');}
addEventListener('keydown',e=>{if(typing())return;if(GAMEKEYS.has(e.code))e.preventDefault();if(!keys[e.code])pressed[e.code]=true;keys[e.code]=true;if(!e.repeat)onKey(e.code);});
addEventListener('keyup',e=>{keys[e.code]=false;if(!typing()&&GAMEKEYS.has(e.code))e.preventDefault();});
addEventListener('blur',()=>{for(const k in keys)keys[k]=false;});
let padPrev=false;
function readInput(){
 const any=a=>a.some(k=>keys[k]);
 let mx=(any(MOVE.right)?1:0)-(any(MOVE.left)?1:0),my=(any(MOVE.down)?1:0)-(any(MOVE.up)?1:0);
 let act=ACT.some(k=>pressed[k]),actH=any(ACT);
 try{
  const g=[...(navigator.getGamepads?navigator.getGamepads():[])].filter(Boolean)[0];
  if(g){const ax=g.axes[0]||0,ay=g.axes[1]||0;if(Math.hypot(ax,ay)>.3){mx=ax;my=ay;}
   const b=n=>!!(g.buttons[n]&&g.buttons[n].pressed);if(b(14))mx=-1;if(b(15))mx=1;if(b(12))my=-1;if(b(13))my=1;
   const ba=b(0)||b(1)||b(2)||b(3);if(ba&&!padPrev)act=true;if(ba)actH=true;padPrev=ba;}
 }catch(e){}
 return {mx,my,act,actH};
}

let G=null,state='title',ANIM=0,levelIdx=0;
function mirrorMap(rows,subs){return rows.map(r=>[...r].reverse().map(ch=>subs[ch]!==undefined?subs[ch]:ch).join(''));}
function buildKitchen(id,rows){
 const tiles=[];let spawn={x:4.5,y:5.5};
 for(let y=0;y<KH;y++){const row=[];for(let x=0;x<KW;x++){const ch=rows[y][x];const type=CHARTYPE[ch]||'floor';
  const t={ch,type,x,y,item:null,prog:0,burn:0,on:false,anim:0,ghost:0,phase:0,seed:Math.random(),warn:0};
  if(type==='crate')t.ing=CRATE[ch];if(ch==='1')spawn={x:x+.5,y:y+.5};row.push(t);}tiles.push(row);}
 return {id,tiles,spawn,orders:[],next:1,dark:0,theme:THEME[id],recipes:[],served:0,step:0,nOrders:0};
}
function tileByChar(K,ch){for(const r of K.tiles)for(const t of r)if(t.ch===ch)return t;return null;}
function startLevel(idx){
 levelIdx=idx;const L=LEVELS[idx];
 const lm=mirrorMap(L.map,L.subs);
 for(const [x,y,ch] of (L.patch||[]))lm[y]=lm[y].slice(0,x)+ch+lm[y].slice(x+1);
 const ks=[buildKitchen(0,L.map),buildKitchen(1,lm)];
 ks[0].recipes=L.recipes[0];ks[1].recipes=L.recipes[1];ks[1].next=L.mode==='goal'?1:2.5;
 const relax=OPTS.relax&&L.mode==='timed';
 G={idx,L,goal:L.mode==='goal',elapsed:0,time:L.dur||0,limit:(L.limit||0)*(relax?1.5:1),interval:(L.interval||0)*(relax?1.3:1),penalty:relax?0:10,
  score:0,served:0,lost:0,kitchens:ks,parts:[],floats:[],ripples:[],banner:null,
  links:L.links.map(s=>({...s,found:!L.hidden,pulse:0,rip:0,src:tileByChar(ks[s.f[0]],s.f[1]),dst:s.t[1]?tileByChar(ks[s.t[0]],s.t[1]):null})),
  players:[0,1].map(i=>({i,k:i,x:ks[i].spawn.x,y:ks[i].spawn.y,dir:{x:0,y:1},held:null,walk:0,moving:false,chopping:false,chopMode:false,chopTile:null,sayCd:0,last:'',snd:0,skin:choice[i],target:null,hint:null}))};
 renderCarnet();
}
const key=it=>it.st?it.k+'_'+it.st:it.k;
function subMulti(a,b){const m={};for(const x of b)m[x]=(m[x]||0)+1;for(const x of a){if(!m[x])return false;m[x]--;}return true;}
function sameMulti(a,b){return a.length===b.length&&subMulti(a,b);}
function addToPlate(K,plate,item){
 const k=key(item);if(!PLATEABLE.has(k))return false;
 const cand=[...plate.c,k];
 if(!K.recipes.some(r=>subMulti(cand,RECIPES[r].items)))return false;
 plate.c.push(k);return true;
}
function solid(K,x,y){if(x<0||y<0||x>=KW||y>=KH)return true;return K.tiles[y][x].type!=='floor';}
function collides(K,x,y,r){return solid(K,Math.floor(x-r),Math.floor(y-r))||solid(K,Math.floor(x+r),Math.floor(y-r))||solid(K,Math.floor(x-r),Math.floor(y+r))||solid(K,Math.floor(x+r),Math.floor(y+r));}
function facing(K,p){
 const get=(dx,dy)=>{const fx=Math.floor(p.x+dx*.8),fy=Math.floor(p.y+dy*.8);if(fx<0||fy<0||fx>=KW||fy>=KH)return null;const t=K.tiles[fy][fx];return t.type==='floor'?null:t;};
 let t=get(p.dir.x,p.dir.y);
 if(!t){if(Math.abs(p.dir.x)>=Math.abs(p.dir.y))t=get(Math.sign(p.dir.x),0);else t=get(0,Math.sign(p.dir.y));}
 return t;
}
const tc=(K,t)=>({x:OX[K.id]+(t.x+.5)*T,y:OY+t.y*T+TOPH/2});
function addFloat(f){G.floats.push(f);emit({f});}
function addRipple(y){G.ripples.push({y,life:1});emit({r:Math.round(y)});}
function say(p,text){if(p.sayCd>0&&p.last===text)return;p.sayCd=1.4;p.last=text;addFloat({x:OX[p.k]+p.x*T,y:OY+p.y*T-T*1.15,text,life:2,max:2,col:'#fff7e6',bg:true});}
function floatAt(x,y,text,col,size){addFloat({x:Math.round(x),y:Math.round(y),text,life:1.6,max:1.6,col:col||'#f1d78a',size:size||18});}
function burst(k,x,y,col,n,kind,noEmit){if(!noEmit)emit({b:[k,Math.round(x),Math.round(y),col,n,kind||'']});for(let i=0;i<n;i++){const a=Math.random()*Math.PI*2,v=rnd(30,110);G.parts.push({k,x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v-(kind==='chip'?60:0),g:kind==='chip'?260:0,life:rnd(.4,.8),max:.8,col,r:rnd(1.5,3.5),kind:kind||'spark'});}}
const rnd=(a,b)=>a+Math.random()*(b-a);

function chopItem(K,t,dt){
 const it=t.item;if(!it||it.st!=='cru'||!CHOP.has(it.k))return;
 it.cp=(it.cp||0)+dt/CHOPT;
 const p=tc(K,t);if(Math.random()<dt*9)burst(K.id,p.x,p.y,chipCol(it.k),1,'chip');
 if(it.cp>=1){it.st='coupe';it.cp=0;burst(K.id,p.x,p.y,chipCol(it.k),8,'chip');SFX.drop();}
}
const chipCol=k=>({tomate:'#e0412f',laitue:'#79c95a',citron:'#f2c62e',fraise:'#d7263d'})[k]||'#fff';
function useTile(K,t){t.on=!t.on;t.anim=1;if(t.type==='sink')SFX.water();else SFX.lever();fire(K,t,'use',0);}
function fire(K,t,ev,dt){for(const L of G.links)if(L.f[0]===K.id&&L.src===t&&L.f[2]===ev)trigger(L,dt);}
function trigger(L,dt){
 const TK=G.kitchens[L.t[0]];
 if(!L.found){L.found=true;SFX.chime();G.banner={text:'Lien découvert',sub:L.label,life:3.6};renderCarnet();
  const [a,b]=linkPts(L);for(let i=0;i<=10;i++){const q=bez(a,b,i/10);burst(-1,q.x,q.y,'#f5d36b',1);}}
 L.pulse=1;L.rip-=dt;
 if(L.t[2]!=='chop'||L.rip<=0){const [a,b]=linkPts(L);addRipple((a.y+b.y)/2);L.rip=.6;}
 const d=L.dst;
 switch(L.t[2]){
  case 'chop':d.ghost=.25;d.phase+=dt;chopItem(TK,d,dt);break;
  case 'power':d.on=!d.on;const q=tc(TK,d);floatAt(q.x,q.y-24,d.on?'Allumé':'Éteint',d.on?'#ffcf7a':'#cfe3ff',15);break;
  case 'dark':TK.dark=DARKT;SFX.dark();break;
  case 'spawn':spawnItem(TK,L.t[3]);break;
 }
}
function spawnItem(K,ing){
 const list=[];for(const r of K.tiles)for(const t of r)if(t.type==='counter'&&!t.item)list.push(t);
 list.sort((a,b)=>Math.hypot(a.x+.5-4.5,a.y+.5-3.5)-Math.hypot(b.x+.5-4.5,b.y+.5-3.5));
 const t=list[0];if(!t){floatAt(OX[K.id]+KPX/2,OY+3*T,'Plus de place…');return;}
 t.item={k:ing,st:'cru'};const p=tc(K,t);burst(K.id,p.x,p.y,'#f5d36b',14);SFX.spawn();floatAt(p.x,p.y-24,'Un cadeau du reflet !','#f1d78a',15);
}
function interact(p,K){
 const t=p.target;if(!t)return;const h=p.held;
 switch(t.type){
  case 'crate':
   if(!h){p.held={k:t.ing,st:'cru'};SFX.pick();}
   else if(h.k===t.ing&&h.st==='cru'){p.held=null;SFX.drop();}
   else say(p,'Une caisse ne garde rien');
   break;
  case 'plates':
   if(!h){p.held={k:'assiette',c:[]};SFX.pick();}
   else if(h.k==='assiette'&&!h.c.length){p.held=null;SFX.drop();}
   else if(h.k!=='assiette'){const pl={k:'assiette',c:[]};if(addToPlate(K,pl,h)){p.held=pl;SFX.pick();}else if(PLATEABLE.has(key(h)))say(p,'Ce plat n’est pas au menu de ta cuisine');else say(p,'Prépare-le d’abord (coupe ou cuisson)');}
   break;
  case 'trash':{
   if(!h)break;const q=tc(K,t);
   if(h.k==='assiette'){if(!h.c.length)break;h.c=[];}else p.held=null;
   burst(K.id,q.x,q.y,'#8a8f9c',8);SFX.drop();fire(K,t,'trash',0);break;}
  case 'serve':
   if(h&&h.k==='assiette'&&h.c.length)serve(K,p,t);else say(p,'Apportez une assiette garnie');
   break;
  case 'counter':case 'board':case 'mboard':{
   const isB=t.type!=='counter';
   if(!h&&t.item){p.held=t.item;t.item=null;SFX.pick();}
   else if(h&&!t.item){
    if(isB&&!(h.st==='cru'&&CHOP.has(h.k))){say(p,'La planche n’accepte que des produits crus');break;}
    t.item=h;p.held=null;SFX.drop();
   } else if(h&&t.item){
    if(h.k==='assiette'&&t.item.k!=='assiette'){if(addToPlate(K,h,t.item)){t.item=null;SFX.drop();}else say(p,'Ça ne va pas dans ce plat');}
    else if(t.item.k==='assiette'&&h.k!=='assiette'){if(addToPlate(K,t.item,h)){p.held=null;SFX.drop();}else say(p,'Ça ne va pas dans ce plat');}
    else say(p,'Déjà occupé');
   }
   break;}
  case 'stove':case 'freezer':{
   const M=MACH[t.type];
   if(!h){
    if(t.item){if(t.item.k===M.out)say(p,'Il faut une assiette');else{p.held=t.item;t.item=null;t.prog=t.burn=0;SFX.pick();}}
   } else if(h.k==='assiette'){
    if(t.item&&t.item.k===M.out){if(addToPlate(K,h,t.item)){t.item=null;t.prog=t.burn=0;SFX.drop();}else say(p,'Ça ne va pas dans ce plat');}
    else if(t.item&&t.item.k===M.ruin)say(p,'C’est fichu… à la poubelle !');
   } else if(!t.item){
    if(key(h)===M.input){t.item=h;p.held=null;t.prog=t.burn=0;SFX.drop();}else say(p,M.wrong);
   } else say(p,'Déjà occupé');
   break;}
  case 'lever':case 'sink':useTile(K,t);break;
 }
}
const rawChop=it=>it&&it.st==='cru'&&CHOP.has(it.k);
function smartPress(p,K){
 const t=p.target;if(!t)return;
 if(t.type==='board'&&(rawChop(t.item)||(!t.item&&!p.held))){p.chopMode=true;p.chopTile=t;return;}
 if(t.type==='mboard'&&rawChop(t.item)){say(p,'Pas de couteau ici : c’est l’autre cuisine qui coupe !');return;}
 if(MACH[t.type]&&!p.held&&!t.item){say(p,'L’interrupteur du '+MACH[t.type].name+' est de l’autre côté du miroir…');return;}
 interact(p,K);
}
function chopAction(p,K,dt){
 const t=p.chopTile;p.chopping=true;t.phase+=dt;if(t.item)chopItem(K,t,dt);fire(K,t,'chop',dt);
 p.snd-=dt;if(p.snd<=0){SFX.chop();p.snd=.18;}
}
function serve(K,p,t){
 const pl=p.held;const i=K.orders.findIndex(o=>sameMulti(pl.c,RECIPES[o.r].items));
 if(i<0){say(p,'Personne n’a commandé ça !');SFX.fail();return;}
 const o=K.orders[i],pts=G.goal?20:20+Math.round(10*o.t/o.max);G.score+=pts;G.served++;K.served++;K.orders.splice(i,1);p.held=null;
 const q=tc(K,t);floatAt(q.x,q.y-20,G.goal?'Bravo !':'+'+pts,'#f1d78a',24);burst(K.id,q.x,q.y,'#f5d36b',18);SFX.serve();
 if(G.goal){K.next=1.2;if(K.served>=G.L.goal)floatAt(OX[K.id]+KPX/2,OY+KH*T/2,'Objectif atteint !','#f1d78a',26);}
 else if(!K.orders.length)K.next=Math.min(K.next,2);
}

// ---------- Mise à jour ----------
function update(dt){
 G.elapsed+=dt;
 if(G.goal){if(G.kitchens.every(K=>K.served>=G.L.goal)){endLevel();return;}}
 else{G.time-=dt;if(G.time<=0){G.time=0;endLevel();return;}}
 control(G.players[0],dt,readInput());control(G.players[1],dt,remoteInput(G.players[1],dt));
 if(G.L.tuto)G.kitchens.forEach((K,i)=>{const st=G.L.tuto[i];if(K.step<st.length&&st[K.step][1](K,G.players[i])){K.step++;SFX.step();}});
 const hOn=OPTS.hints==='always'||(OPTS.hints==='auto'&&G.L.course==='Apéritif');G.players.forEach(p=>{p.hint=hOn?hintFor(p):null;});
 for(const K of G.kitchens){
  for(const r of K.tiles)for(const t of r){
   t.anim=Math.max(0,t.anim-dt*2.5);t.ghost=Math.max(0,t.ghost-dt);
   const M=MACH[t.type];
   if(M&&t.item&&t.on){
    const k=key(t.item),q=tc(K,t);
    if(k===M.input){t.prog+=dt/COOK;
     if(t.prog>=1){t.item={k:M.out};t.prog=0;t.burn=0;SFX.ready();floatAt(q.x,q.y-26,'Prêt !','#bff2c4',16);}}
    else if(k===M.out){t.burn+=dt/RUIN;
     if(t.burn>.5){t.warn-=dt;if(t.warn<=0){SFX.warn();t.warn=.55;}}
     if(t.burn>=1){t.item={k:M.ruin};t.burn=0;SFX.fail();floatAt(q.x,q.y-26,M.ruinMsg,'#ff9d8a',17);}}
   }
  }
  updOrders(K,dt);
  K.dark=Math.max(0,K.dark-dt);
 }
 for(const L of G.links)L.pulse=Math.max(0,L.pulse-dt*1.6);
 if(G.banner){G.banner.life-=dt;if(G.banner.life<=0)G.banner=null;}
 ambientFx(dt);updFx(dt);
}
function ambientFx(dt){for(const K of G.kitchens)for(const r of K.tiles)for(const t of r){const M=MACH[t.type];if(!M||!t.item||!t.on)continue;const k=key(t.item),q=tc(K,t);
 if(k===M.input&&Math.random()<dt*5)G.parts.push({k:K.id,x:q.x+rnd(-8,8),y:q.y-6,vx:rnd(-6,6),vy:-28,g:0,life:1.2,max:1.2,col:t.type==='stove'?'rgba(255,255,255,.7)':'rgba(190,230,255,.9)',r:4,kind:'puff'});
 else if(k===M.out&&t.burn>.5&&Math.random()<dt*8)G.parts.push({k:K.id,x:q.x+rnd(-8,8),y:q.y-6,vx:rnd(-6,6),vy:-34,g:0,life:1.3,max:1.3,col:t.type==='stove'?'rgba(60,55,55,.7)':'rgba(220,245,255,.95)',r:5,kind:'puff'});}}
function updFx(dt){
 if(!G)return;
 for(const q of G.parts){q.x+=q.vx*dt;q.y+=q.vy*dt;q.vy+=q.g*dt;q.life-=dt;}
 G.parts=G.parts.filter(q=>q.life>0);
 for(const f of G.floats){f.y-=dt*(f.bg?10:26);f.life-=dt;}
 G.floats=G.floats.filter(f=>f.life>0);
 for(const r of G.ripples)r.life-=dt*1.2;
 G.ripples=G.ripples.filter(r=>r.life>0);
}
function moveP(p,K,inp,dt){
 const len=Math.hypot(inp.mx,inp.my);p.moving=len>.2;
 if(p.moving){const nx=inp.mx/len,ny=inp.my/len,sp=SPEED*Math.min(1,len)*dt;p.dir={x:nx,y:ny};
  const r=.3;if(!collides(K,p.x+nx*sp,p.y,r))p.x+=nx*sp;if(!collides(K,p.x,p.y+ny*sp,r))p.y+=ny*sp;p.walk+=dt*13;}
 else p.walk=0;
}
function control(p,dt,inp){
 const K=G.kitchens[p.k];
 if(inp.remote)p.moving=inp.mv;else moveP(p,K,inp,dt);
 p.target=facing(K,p);p.sayCd=Math.max(0,p.sayCd-dt);
 p.chopping=false;
 if(inp.act)smartPress(p,K);
 if(p.chopMode){if(inp.actH&&!p.moving&&p.target===p.chopTile)chopAction(p,K,dt);else p.chopMode=false;}
}
function kitchenHas(K,k){
 const chk=it=>it&&(key(it)===k||(it.k==='assiette'&&it.c.includes(k)));
 if(G.players.some(pl=>pl.k===K.id&&chk(pl.held)))return true;
 for(const r of K.tiles)for(const t of r)if(chk(t.item))return true;return false;
}
const BASE={soupe:'tomate',sorbet:'citron'};
const baseOf=k=>BASE[k]||k.split('_')[0];
function allTiles(K,f){const r=[];for(const row of K.tiles)for(const t of row)if(f(t))r.push(t);return r;}
function nearestT(p,list){let b=null,bd=1e9;for(const t of list){const d=Math.hypot(t.x+.5-p.x,t.y+.5-p.y);if(d<bd){bd=d;b=t;}}return b;}
function hintFor(p){
 const K=G.kitchens[p.k],h=p.held;
 for(const L of G.links){

function wallDeco(K,ox,y0){

   c.strokeStyle='rgba(60,30,15,.12)';c.strokeRect(px+.5,py+.5,T-1,T-1);}
  const lx=ox+KPX/2,ly=OY+KH*T*.48,gl=c.createRadialGradient(lx,ly,20,lx,ly,KPX*.62);gl.addColorStop(0,th.light);gl.addColorStop(1,'rgba(0,0,0,0)');c.fillStyle=gl;c.fillRect(ox,OY,KPX,KH*T);

   if(t.type!=='floor'&&x<KW-1&&K.tiles[y][x+1].type==='floor'){c.fillStyle=lg(ox+(x+1)*T,0,ox+(x+1)*T+8,0,[[0,'rgba(30,12,4,.18)'],[1,'rgba(30,12,4,0)']]);c.fillRect(ox+(x+1)*T,OY+y*T,8,T);}}

const NET={ws:null,role:null,code:null,partner:false,out:[],remote:{x:4.5,y:5.5,dx:0,dy:1,mv:0,w:0,pr:0,h:0},lastPr:0,pr:0,sendT:0,snapT:0,ready:[false,false],ping:null,pingT:0,joinErr:'',onOpen:null};

function emit(e){if(NET.role==='host'&&state==='play')NET.out.push(e);}
function wsUrl(){return (location.protocol==='https:'?'wss://':'ws://')+location.host+'/ws';}
function netOpen(then){
 if(NET.ws&&NET.ws.readyState===1){then();return;}
 if(NET.ws&&NET.ws.readyState===0){NET.onOpen=then;return;}
 let ws;try{if(!/^https?:$/.test(location.protocol))throw new Error('file');ws=new WebSocket(wsUrl());}catch(e){noServer();return;}
 NET.ws=ws;NET.onOpen=then;
 ws.onopen=()=>{const f=NET.onOpen;NET.onOpen=null;if(f)f();};
 ws.onmessage=e=>{let m;try{m=JSON.parse(e.data);}catch(_){return;}netMsg(m);};
 ws.onclose=()=>{const had=!!NET.role;NET.ws=null;NET.role=null;NET.partner=false;NET.code=null;updBar();if(had)lostServer();else noServer();};
}
function netSend(o){if(NET.ws&&NET.ws.readyState===1)NET.ws.send(JSON.stringify(o));}
function netClose(){const ws=NET.ws;NET.role=null;NET.partner=false;NET.code=null;NET.ws=null;if(ws){ws.onclose=null;try{ws.close();}catch(e){}}updBar();}

function netMsg(m){
 switch(m.t){
  case 'created':NET.role='host';NET.code=m.code;NET.partner=false;waitScreen();break;
  case 'joined':NET.role='guest';NET.code=m.code;NET.partner=true;choice[1]=mySkin;netSend({t:'skin',i:mySkin});charsScreen();break;
  case 'partner':NET.partner=true;choice[0]=mySkin;netSend({t:'skin',i:mySkin});charsScreen();break;
  case 'error':NET.joinErr=m.msg;netClose();titleScreen();break;
  case 'left':partnerLeft(!!m.hostLeft);break;
  case 'pong':NET.ping=Math.round(performance.now()-m.at);updBar();break;
  case 'skin':choice[otherI()]=m.i;if(G)G.players[otherI()].skin=m.i;if(state==='chars')charsScreen();break;
  case 'chars':if(!isHost())charsScreen();break;
  case 'menu':if(!isHost())guestMenuWait();break;
  case 'brief':if(!isHost())briefScreen(m.i);break;
  case 'ready':NET.ready[otherI()]=true;updReady();tryStart();break;
  case 'start':if(!isHost()){startLevel(m.i);go();}break;
  case 'in':if(isHost())NET.remote=m;break;

function snapshot(){
 const ks=G.kitchens.map(K=>{const tl=[];let i=0;for(const row of K.tiles)for(const t of row){if(t.type!=='floor'&&(t.item||t.prog||t.burn||t.on||t.anim>0||t.ghost>0))tl.push([i,t.item,R2(t.prog),R2(t.burn),t.on?1:0,R2(t.anim),R2(t.ghost),R2(t.phase)]);i++;}
  return {tl,o:K.orders.map(o=>[o.r,R2(o.t),o.max,R2(o.age)]),d:R2(K.dark),sv:K.served,st:K.step};});
 const pos=t=>t?[t.x,t.y]:null;

 s.k.forEach((ks,ki)=>{
  const K=G.kitchens[ki],flat=[];for(const row of K.tiles)for(const t of row)flat.push(t);const seen=new Set();
  for(const [i,item,prog,burn,on,anim,ghost,phase] of ks.tl){const t=flat[i];if(!t)continue;seen.add(i);t.item=item;t.prog=prog;t.burn=burn;t.on=!!on;t.anim=anim;t.ghost=ghost;t.phase=phase;}
  flat.forEach((t,i)=>{if(!seen.has(i)&&t.type!=='floor'){t.item=null;t.prog=0;t.burn=0;t.on=false;t.anim=0;t.ghost=0;}});
  K.orders=ks.o.map(([r,t,max,age])=>({r,t,max,age}));K.dark=ks.d;K.served=ks.sv;K.step=ks.st;
 });
 s.p.forEach((ps,i)=>{
  const p=G.players[i],K=G.kitchens[i],at=a=>a?K.tiles[a[1]][a[0]]:null;

 const me=G.players[1],K=G.kitchens[1],inp=readInput();
 moveP(me,K,inp,dt);me.target=facing(K,me);
 const o=G.players[0];if(o.tx!==undefined){const a=Math.min(1,dt*14);o.x+=(o.tx-o.x)*a;o.y+=(o.ty-o.y)*a;}
 if(inp.act)NET.pr++;
 NET.sendT-=dt;
 if(NET.sendT<=0||inp.act){netSend({t:'in',x:R2(me.x),y:R2(me.y),dx:R2(me.dir.x),dy:R2(me.dir.y),mv:me.moving?1:0,w:R2(me.walk),pr:NET.pr,h:inp.actH?1:0});NET.sendT=1/30;}
 for(const L of G.links)L.pulse=Math.max(0,L.pulse-dt*1.6);
 if(G.banner){G.banner.life-=dt;if(G.banner.life<=0)G.banner=null;}
 for(const Kk of G.kitchens)Kk.dark=Math.max(0,Kk.dark-dt);
 if(G.goal)G.elapsed+=dt;else G.time=Math.max(0,G.time-dt);
 ambientFx(dt);updFx(dt);
}

// ---------- Carnet ----------
function renderCarnet(){
 const ul=document.getElementById('carnetList'),em=document.getElementById('carnetEmpty'),pn=document.getElementById('carnetPanel');
 const on=!!(G&&G.L.hidden);pn.style.display=on?'block':'none';if(!on){ul.innerHTML='';return;}
 const found=G.links.filter(l=>l.found),hid=G.links.length-found.length;em.textContent='';
 ul.innerHTML=found.map(l=>'<li>'+l.label+'</li>').join('')+(hid?'<li class="mys">'+hid+' caché'+(hid>1?'s':'')+'</li>':'');
}
function updBar(){
 const r=document.getElementById('barRoom');
 if(r)r.innerHTML=NET.role?'Salle <b class="code">'+NET.code+'</b> · '+(NET.partner?'2/2':'1/2')+(NET.ping!=null?' · '+NET.ping+' ms':''):'';
 const mb=document.getElementById('menuBtn');if(mb)mb.style.display=NET.role==='host'?'':'none';
}

// ---------- Écrans ----------
const ov=document.getElementById('overlay');
function show(html){ov.innerHTML=html;ov.classList.remove('hidden');}
function hide(){ov.classList.add('hidden');ov.innerHTML='';}
function starsHtml(n){let s='';for(let i=0;i<3;i++)s+=i<n?'★':'<span class="off">★</span>';return s;}
function showMsg(txt){state='lobby';show(`<div class="card"><h2>${txt}</h2><p class="small">Un instant…</p></div>`);}
function titleScreen(){
 state='title';const pre=(location.hash||'').replace('#','').toUpperCase().replace(/[^A-Z]/g,'').slice(0,4);
 show(`<div class="card"><div class="deco">✦ ✦ ✦</div><h1>CUISINE MIROIR</h1><p class="sub">Deux cuisines. Un miroir.</p>
 <div class="lobby"><div><button class="btn primary" data-act="create">Créer une salle</button></div>
 <div><input id="joinCode" maxlength="4" placeholder="CODE" value="${pre}" autocomplete="off" spellcheck="false"><button class="btn" data-act="join">Rejoindre</button></div></div>
 ${NET.joinErr?`<p class="err">${NET.joinErr}</p>`:''}</div>`);
 const inp=document.getElementById('joinCode');
 inp.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();joinRoom(inp.value);}});
 inp.addEventListener('input',()=>{inp.value=inp.value.toUpperCase().replace(/[^A-Z]/g,'').slice(0,4);});
}
function noServer(){state='title';show(`<div class="card"><h2>SERVEUR INTROUVABLE</h2><p class="small">Ouvre le jeu depuis son adresse Render. S’il dormait, réessaie dans une minute.</p><button class="btn primary" data-act="title">Retour</button></div>`);}
function lostServer(){state='title';show(`<div class="card"><h2>CONNEXION PERDUE</h2><button class="btn primary" data-act="title">Retour</button></div>`);}
function waitScreen(info){
 state='lobby';const link=location.origin+location.pathname+'#'+NET.code;
 show(`<div class="card"><div class="deco">SALLE</div><div class="bigcode">${NET.code}</div>
 <button class="btn" data-act="copy" data-l="${link}">Copier le lien</button><button class="btn" data-act="leave">Annuler</button>
 ${info?`<p class="err">${info}</p>`:''}<p class="sub">En attente…</p></div>`);
}
function partnerLeft(hostLeft){
 if(hostLeft){netClose();state='title';show(`<div class="card"><h2>SALLE FERMÉE</h2><button class="btn primary" data-act="title">Retour</button></div>`);}
 else{NET.partner=false;NET.ready=[false,false];waitScreen('Partenaire déconnecté.');}
}
function charsScreen(){
 state='chars';const me=meI();choice[me]=mySkin;
 const team=k=>{const mine=k===me;
  const roster=mine?SKINS.map((s,i)=>`<button class="chr${choice[k]===i?' sel':''}" data-act="pick" data-i="${i}"><canvas width="84" height="84" data-skin="${i}" data-team="${k}"></canvas><span>${s.nom}</span></button>`).join('')
   :`<div class="chr sel" style="cursor:default"><canvas width="84" height="84" data-skin="${choice[k]}" data-team="${k}"></canvas><span>${SKINS[choice[k]].nom}</span></div>`;
  return `<div class="team ${k?'lune':'sol'}"><h3>${mine?'Toi':'Partenaire'}</h3><div class="roster">${roster}</div></div>`;};
 show(`<div class="card"><h2>LA BRIGADE</h2><div class="chars">${team(0)}${team(1)}</div>
 ${isHost()?'<button class="btn primary" data-act="menu" style="margin-top:16px">Continuer</button>':''}</div>`);
 drawPreviews();
}
function drawPreviews(){
 const prev=c;ov.querySelectorAll('canvas[data-skin]').forEach(cv2=>{const ctx=cv2.getContext('2d');c=ctx;ctx.clearRect(0,0,84,84);drawChef(+cv2.dataset.skin,42,76,27,{x:0,y:1},ANIM*6,THEME[+cv2.dataset.team].accent,null,false);});c=prev;
}
function setChoice(i){mySkin=(i+SKINS.length)%SKINS.length;choice[meI()]=mySkin;save('mySkin',mySkin);netSend({t:'skin',i:mySkin});charsScreen();}
function hostMenu(){netSend({t:'menu'});menuScreen();}
function menuScreen(){state='menu';
 const rows=COURSES.map(cn=>{const lv=LEVELS.map((L,i)=>({L,i})).filter(o=>o.L.course===cn);
  const inner=lv.length?lv.map(({L,i})=>`<button class="btn lvbtn" data-act="brief" data-i="${i}">${L.num} · ${L.name}<span class="st">${starsHtml(BEST[L.id]||0)}</span></button>`).join(''):'<span class="soon">Bientôt</span>';
  return `<div class="course"><div class="cname">${cn}</div><div class="lv">${inner}</div></div>`;}).join('');
 show(`<div class="card"><h2>MENU</h2>${rows}
 <div class="opts"><button class="btn small-btn" data-act="opt" data-o="hints">Aide : ${HINTLBL[OPTS.hints]||'Apéritif seulement'}</button><button class="btn small-btn" data-act="opt" data-o="relax">Rythme : ${OPTS.relax?'tranquille':'normal'}</button><button class="btn small-btn" data-act="tochars">Commis</button></div></div>`);
}
function guestMenuWait(){state='menu';show(`<div class="card"><h2>MENU</h2><p class="sub">Ton partenaire choisit…</p></div>`);}
function hostBrief(i){netSend({t:'brief',i});briefScreen(i);}
function briefScreen(i){
 state='brief';levelIdx=i;NET.ready=[false,false];startLevel(i);const L=LEVELS[i];
 const keys=(i===0||!NET.keysShown)?`<div class="keys"><div><span class="pad"><kbd>↑</kbd><br><kbd>←</kbd><kbd>↓</kbd><kbd>→</kbd></span><span>bouger</span></div><div><kbd class="space">Espace</kbd><span>tout le reste</span></div></div>`:'';NET.keysShown=true;
 show(`<div class="card"><div class="deco">${L.course.toUpperCase()} · ${L.num}</div><h2>${L.name.toUpperCase()}</h2>
 <p class="big">${L.nouveau}</p>${keys}
 <div class="readies"><span id="rd0"></span><span id="rd1"></span></div>
 <button class="btn primary" data-act="ready" id="readyBtn">Prêt</button>${isHost()?'<button class="btn" data-act="menu">Menu</button>':''}</div>`);
 updReady();
}
function updReady(){
 for(const k of [0,1]){const el=document.getElementById('rd'+k);if(el)el.innerHTML=(k===meI()?'Toi':'Partenaire')+(NET.ready[k]?' <b class="ok">✓</b>':' …');}
 const b=document.getElementById('readyBtn');if(b&&NET.ready[meI()]){b.textContent='En attente…';b.disabled=true;}
}
function setReady(){if(state!=='brief'||NET.ready[meI()])return;NET.ready[meI()]=true;netSend({t:'ready'});updReady();tryStart();}
function tryStart(){if(isHost()&&state==='brief'&&NET.ready[0]&&NET.ready[1]){netSend({t:'start',i:levelIdx});startLevel(levelIdx);go();}}
function go(){hide();state='play';for(const k in pressed)delete pressed[k];NET.lastPr=NET.remote.pr;NET.snapT=0;NET.out=[];
 G.players.forEach(p=>p.skin=choice[p.i]);const sp=G.kitchens[1].spawn;NET.remote=Object.assign({},NET.remote,{x:sp.x,y:sp.y,dx:0,dy:1,mv:0,h:0});}
function pauseGame(fromNet){if(state!=='play')return;state='pause';if(!fromNet)netSend({t:'pause'});
 show(`<div class="card"><h2>PAUSE</h2><p class="sub">Le service attend…</p><button class="btn primary" data-act="resume">Reprendre (Échap)</button>${isHost()?`<button class="btn" data-act="brief" data-i="${levelIdx}">Recommencer</button><button class="btn" data-act="menu">Menu</button>`:''}</div>`);}
function resumeGame(fromNet){if(state!=='pause')return;hide();state='play';if(!fromNet)netSend({t:'resume'});}
function endLevel(){
 state='result';const L=G.L,s=G.score,tm=Math.floor(G.elapsed);
 const n=G.goal?(tm<=L.timeStars[0]?3:tm<=L.timeStars[1]?2:1):L.stars.filter(v=>s>=v).length;
 const r={idx:levelIdx,n,s,tm,served:G.served,lost:G.lost,found:G.links.filter(l=>l.found).length,total:G.links.length,goal:G.goal};
 netSend({t:'result',r});showResult(r);
}
function showResult(r){
 state='result';const L=LEVELS[r.idx];levelIdx=r.idx;
 if(r.n>(BEST[L.id]||0)){BEST[L.id]=r.n;save('best',BEST);}SFX0.end();
 const next=r.idx+1<LEVELS.length;
 const main=r.goal?`${Math.floor(r.tm/60)}:${String(r.tm%60).padStart(2,'0')}`:`${r.s} pts`;
 const btns=isHost()?(next?`<button class="btn primary" data-act="brief" data-i="${r.idx+1}">Suivant</button>`:'')+`<button class="btn" data-act="brief" data-i="${r.idx}">Rejouer</button><button class="btn" data-act="menu">Menu</button>`:'';
 show(`<div class="card"><h2>${L.name.toUpperCase()}</h2><div class="stars">${starsHtml(r.n)}</div>
 <div class="stats"><div><b>${main}</b>${r.goal?'temps':'score'}</div>${r.total>1||L.hidden?`<div><b>${r.found}/${r.total}</b>liens</div>`:''}</div>${btns}</div>`);
}
ov.addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(!b)return;audioInit();const a=b.dataset.act;
 if(a==='create')createRoom();
 else if(a==='join'){const i=document.getElementById('joinCode');joinRoom(i?i.value:'');}
 else if(a==='title'){netClose();titleScreen();}
 else if(a==='leave'){netClose();titleScreen();}
 else if(a==='copy'){try{navigator.clipboard.writeText(b.dataset.l).then(()=>{b.textContent='Lien copié ✓';},()=>{b.textContent='Copie impossible : sélectionne le lien';});}catch(err){b.textContent='Copie impossible : sélectionne le lien';}}
 else if(a==='pick')setChoice(+b.dataset.i);
 else if(a==='menu'){if(isHost())hostMenu();}
 else if(a==='tochars'){if(isHost()){netSend({t:'chars'});charsScreen();}}
 else if(a==='brief'){if(isHost())hostBrief(+b.dataset.i);}
 else if(a==='ready')setReady();
 else if(a==='resume')resumeGame();
 else if(a==='opt'){const o=b.dataset.o;if(o==='hints'){const seq=['auto','always','never'];OPTS.hints=seq[(seq.indexOf(OPTS.hints)+1)%3];}else OPTS[o]=!OPTS[o];save('opts2',OPTS);menuScreen();}
});
function onKey(code){
 audioInit();const ok=code==='Enter'||code==='Space';
 if(state==='chars'){if(code==='ArrowLeft'||code==='KeyA')setChoice(mySkin-1);else if(code==='ArrowRight'||code==='KeyD')setChoice(mySkin+1);else if(ok&&isHost())hostMenu();}
 else if(state==='brief'&&ok)setReady();
 else if(state==='play'&&(code==='Escape'||code==='KeyP'))pauseGame();
 else if(state==='pause'&&(code==='Escape'||code==='KeyP'))resumeGame();
 else if(state==='result'&&ok&&isHost()&&levelIdx+1<LEVELS.length)hostBrief(levelIdx+1);
}
document.getElementById('pauseBtn').addEventListener('click',e=>{e.currentTarget.blur();audioInit();if(state==='play')pauseGame();else if(state==='pause')resumeGame();});
document.getElementById('muteBtn').addEventListener('click',e=>{e.currentTarget.blur();muted=!muted;e.currentTarget.textContent='Son : '+(muted?'coupé':'activé');});
document.getElementById('menuBtn').addEventListener('click',e=>{e.currentTarget.blur();audioInit();if(isHost()&&NET.partner&&state!=='play')hostMenu();else if(isHost()&&state==='play')pauseGame();});

// ---------- Boucle ----------
let last=performance.now();
function frame(now){
 const dt=Math.min(.05,(now-last)/1000);last=now;ANIM+=dt;
 try{
  if(state==='play'){
   if(isHost()){update(dt);NET.snapT-=dt;if(state==='play'&&NET.snapT<=0){NET.snapT=.05;netSend(snapshot());}}
   else if(NET.role==='guest')guestStep(dt);
  } else updFx(dt);
  if(state==='chars'&&Math.floor(ANIM*10)%2===0)drawPreviews();
  NET.pingT-=dt;if(NET.pingT<=0&&NET.ws&&NET.ws.readyState===1){NET.pingT=3;netSend({t:'ping',at:performance.now()});}
  render();
 }catch(err){console.error(err);}
 for(const k in pressed)delete pressed[k];
 requestAnimationFrame(frame);
}
startLevel(0);titleScreen();updBar();renderCarnet();
requestAnimationFrame(frame);
window.__cm={get G(){return G},get state(){return state},NET,startLevel,go,LEVELS,interact,smartPress,chopAction,update,briefScreen,hintFor,joinRoom,createRoom};
})();
</script>
