<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cuisine en Duo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#2b2638;font-family:'Baloo 2',system-ui,sans-serif;color:#2b2140}
#stage{position:fixed;inset:0}
#gl,#hud{position:absolute;inset:0;width:100%;height:100%;display:block}
#hud{pointer-events:none}
.screen{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(30,22,44,.55);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);padding:16px;overflow:auto}
.screen.hidden{display:none}
.card{background:#fffaf0;border:5px solid #2b2140;border-radius:28px;box-shadow:0 10px 0 #2b2140,0 18px 40px rgba(0,0,0,.35);padding:26px 34px;max-width:560px;width:100%;text-align:center}
.card.wide{max-width:820px}
h1{font-size:64px;line-height:.9;margin:4px 0 6px;color:#e8603c;text-shadow:3px 4px 0 #2b2140;letter-spacing:.01em}
h1 span{color:#2a9d9f}
h2{font-size:34px;margin:2px 0 10px;color:#2b2140}
.sub{font-size:20px;color:#6a5a7a;margin:6px 0 14px}
.small{font-size:16px;color:#6a5a7a}
.tiny{font-size:13px;margin-top:14px}.tiny a{color:#8a7a9a}
.err{color:#d13a2a;font-weight:700}
.btn{font-family:inherit;font-weight:800;font-size:18px;color:#fff;background:#2a9d9f;border:4px solid #2b2140;border-radius:16px;padding:8px 20px;margin:6px;cursor:pointer;box-shadow:0 5px 0 #2b2140;transition:transform .08s}
.btn:hover{transform:translateY(-2px)}.btn:active{transform:translateY(3px);box-shadow:0 2px 0 #2b2140}
.btn.big{background:#e8603c;font-size:22px;padding:10px 28px}
.btn.ghost{background:#fff;color:#2b2140}
.btn[disabled]{opacity:.6}
.lobby{display:grid;grid-template-columns:1fr 1fr;gap:16px;align-items:center;margin-top:10px}
#joinCode{font-family:inherit;font-weight:800;font-size:30px;letter-spacing:.3em;text-align:center;width:170px;border:4px solid #2b2140;border-radius:14px;padding:4px 0 4px .3em;text-transform:uppercase;display:block;margin:0 auto 4px}
.bigcode{font-size:80px;font-weight:800;letter-spacing:.25em;color:#e8603c;text-shadow:3px 4px 0 #2b2140;padding-left:.25em;line-height:1.1}
.chars{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin:8px 0 12px}
.team{border:4px solid var(--pc);border-radius:20px;padding:8px}
.team h3{margin:0 0 6px;color:var(--pc);font-size:22px}
.roster{display:flex;flex-wrap:wrap;justify-content:center;gap:6px}
.chr{font-family:inherit;width:96px;border:3px solid transparent;border-radius:16px;background:#f3ead9;padding:2px 0 4px;cursor:pointer;color:#2b2140;font-weight:700}
.chr canvas{display:block;margin:0 auto}.chr.sel{border-color:#2b2140;background:#fff}
.levels{display:flex;gap:14px;justify-content:center;flex-wrap:wrap;margin:6px 0 12px}
.lvl{font-family:inherit;width:200px;border:4px solid #2b2140;border-radius:20px;background:#ffe9b8;padding:12px;cursor:pointer;box-shadow:0 6px 0 #2b2140;color:#2b2140}
.lvl b{display:block;font-size:30px;color:#e8603c}.lvl span{display:block;font-size:18px;font-weight:700}.lvl em{font-style:normal;font-size:24px}
.on{color:#f2b51a;text-shadow:0 2px 0 #2b2140}.off{color:#d8cdb8}
.tag{display:inline-block;background:#2b2140;color:#ffd34d;font-weight:800;border-radius:10px;padding:0 12px;font-size:18px}
.recipes{display:flex;gap:18px;justify-content:center;margin:4px 0 8px}.recipes div{display:flex;flex-direction:column;align-items:center;font-weight:700}
.keys{display:flex;justify-content:center;gap:26px;margin:10px 0;align-items:flex-start;flex-wrap:wrap}
.keys>div{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:15px;color:#6a5a7a;line-height:1.15}
kbd{display:inline-block;min-width:34px;padding:3px 8px;margin:2px;border:3px solid #2b2140;border-bottom-width:5px;border-radius:9px;background:#fff;font-family:inherit;font-weight:800;color:#2b2140}
kbd.space{min-width:150px}kbd.shift{min-width:60px}.pad{text-align:center;line-height:1}
.readies{display:flex;justify-content:center;gap:24px;margin:8px 0;font-size:18px;font-weight:700}.readies i{display:inline-block;width:12px;height:12px;border-radius:50%;margin-right:6px}.ok{color:#2a9d5f}
.stars{font-size:56px;letter-spacing:.1em}
.stats{display:flex;justify-content:center;gap:26px;margin:6px 0}.stats div{font-size:15px;color:#6a5a7a}.stats b{display:block;font-size:34px;color:#2b2140}
#tools{position:fixed;top:12px;right:12px;display:flex;gap:8px;align-items:center;z-index:5}
#tools button{font-family:inherit;font-size:18px;width:44px;height:44px;border-radius:14px;border:3px solid #2b2140;background:#fffaf0;cursor:pointer;box-shadow:0 4px 0 #2b2140}
#status{font-weight:700;color:#fff;background:rgba(30,22,44,.75);border-radius:12px;padding:4px 12px;font-size:15px}#status:empty{display:none}
@media (max-width:700px){.lobby,.chars{grid-template-columns:1fr}h1{font-size:46px}}
</style>
</head>
<body>
<div id="stage"><canvas id="gl"></canvas><canvas id="hud"></canvas><div id="overlay" class="screen"></div></div>
<div id="tools"><span id="status"></span><button id="pauseBtn" title="Pause">⏸</button><button id="muteBtn" title="Son">🔊</button></div>
<script>
(()=>{
'use strict';
/*SCRIPTS*/
})();
</script>
</body>
</html>
