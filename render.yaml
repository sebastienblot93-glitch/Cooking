# yaml-language-server: $schema=https://render.com/schema/render.yaml.json
# Blueprint Render : le jeu est rangé dans le projet "Cooking", environnement "production".
# C'est un site statique (un seul fichier index.html, aucune compilation).
projects:
  - name: Cooking
    environments:
      - name: production
        services:
          - type: web
            runtime: static
            name: cuisine-miroir
            branch: main
            buildCommand: echo "Aucune compilation necessaire"
            staticPublishPath: ./
